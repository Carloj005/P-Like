name: Build Windows & Linux Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Build P-Like-Studio.exe and plike.exe
        run: python build_exe.py

      - name: Smoke test plike.exe
        run: |
          .\dist\plike.exe --version
          .\dist\plike.exe run examples\hello.plike --napoli win
          .\dist\plike.exe run examples\esame_studente.plike --napoli win -q

      - name: Upload Windows Executables artifact
        uses: actions/upload-artifact@v4
        with:
          name: P-Like-Windows-Executables
          path: |
            dist/P-Like-Studio.exe
            dist/plike.exe

  build-linux:
    name: Build Linux Universal (AppImage + tar.gz + CLI)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tcl/Tk, Xvfb and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tcl8.6 tk8.6 python3-tk \
            xvfb desktop-file-utils \
            libfontconfig1 libxft2 libxrender1 \
            fonts-dejavu-core file

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Tkinter availability
        run: python -c "import tkinter; print('TkVersion:', tkinter.TkVersion)"

      - name: Validate Linux .desktop metadata
        run: desktop-file-validate packaging/linux/p-like-studio.desktop

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Run full unit & GUI test suite under Xvfb
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Build Universal Linux AppImage, tar.gz and standalone CLI
        run: python build_linux.py --download-appimagetool

      - name: Smoke test Linux CLI, GUI binary, AppImage and installers
        run: |
          ./dist/plike-linux-x86_64 --version
          ./dist/plike-linux-x86_64 run examples/hello.plike --napoli win
          ./dist/plike-linux-x86_64 run examples/esame_studente.plike --napoli win -q

          # Smoke test GUI standalone sotto Xvfb (exit 124 = timeout => finestra aperta e stabile!)
          set +e
          xvfb-run -a timeout 5s ./dist/P-Like-Studio
          RC_GUI=$?
          xvfb-run -a timeout 5s ./dist/P-Like-Studio-x86_64.AppImage --appimage-extract-and-run
          RC_APPIMAGE=$?
          set -e
          echo "GUI exit=$RC_GUI AppImage exit=$RC_APPIMAGE"
          test "$RC_GUI" -eq 124
          test "$RC_APPIMAGE" -eq 124

          # Verifica modalita' CLI integrata dentro l'AppImage
          ./dist/P-Like-Studio-x86_64.AppImage --appimage-extract-and-run --cli --version

          # Verifica install.sh / uninstall.sh dal pacchetto portatile .tar.gz in una HOME isolata
          TMPHOME="$(mktemp -d)"
          tar -xzf dist/P-Like-Linux-x86_64.tar.gz -C "$TMPHOME"
          HOME="$TMPHOME" "$TMPHOME/P-Like-Linux-x86_64/install.sh"
          HOME="$TMPHOME" "$TMPHOME/.local/bin/plike" --version
          test -f "$TMPHOME/.local/share/applications/p-like-studio.desktop"
          test -f "$TMPHOME/.local/share/icons/hicolor/256x256/apps/p-like-studio.png"
          HOME="$TMPHOME" "$TMPHOME/P-Like-Linux-x86_64/uninstall.sh"

          # Verifica anche install-from-source.sh (per ARM64 / qualsiasi distro)
          TMPHOME2="$(mktemp -d)"
          HOME="$TMPHOME2" ./packaging/linux/install-from-source.sh
          HOME="$TMPHOME2" "$TMPHOME2/.local/bin/plike" run examples/hello.plike --napoli win -q
          rm -rf "$TMPHOME" "$TMPHOME2"

      - name: Upload Linux Executables artifact
        uses: actions/upload-artifact@v4
        with:
          name: P-Like-Linux-Executables
          path: |
            dist/P-Like-Studio-x86_64.AppImage
            dist/P-Like-Linux-x86_64.tar.gz
            dist/plike-linux-x86_64

  release:
    name: Publish Unified GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-files
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
