name: Build Windows Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Build P-Like-Studio.exe and plike.exe
        run: python build_exe.py

      - name: Smoke test plike.exe
        run: |
          .\dist\plike.exe --version
          .\dist\plike.exe run examples\hello.plike --napoli win

      - name: Upload Windows Executables artifact
        uses: actions/upload-artifact@v4
        with:
          name: P-Like-Windows-Executables
          path: |
            dist/P-Like-Studio.exe
            dist/plike.exe

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/P-Like-Studio.exe
            dist/plike.exe
